# 经济参数：电价、碳因子、折现率、惩罚系数
# 单位约定见 SPEC §1.1（电价 元/MWh，碳因子 kgCO₂/MWh）

# ---------------------------------------------------------------- 电价
#
# 峰谷平三段式。可在 regions/*.yaml 中覆盖为地区特定曲线。
electricity:
  # 时段划分（小时，左闭右开）
  segments:
    valley: [0, 8]        # 谷段
    flat:   [8, 10]       # 平段
    peak:   [10, 12]      # 峰段
    flat2:  [12, 18]
    peak2:  [18, 22]
    valley2: [22, 24]
  # 价格（元/MWh）
  price_valley: 280.0
  price_flat: 430.0
  price_peak: 620.0
  price_sell: 0.0          # 上网电价，默认 0（与 system.yaml 的 export_capacity_mw=0 一致）
  source: "PLACEHOLDER — 需替换为地区实际分时电价政策口径"

# ---------------------------------------------------------------- 电网碳因子
carbon:
  ci_grid_mid: 580.0
  unit: "kgCO₂/MWh"
  # ⚠️ 若使用逐时碳因子，需注明数据来源与年份。若使用年度平均值，
  #    应在报告中说明这一简化及其对结果的方向性影响。
  source: "PLACEHOLDER — 需替换为公开的区域电网排放因子"

  # 储能制造阶段碳足迹是否计入净碳指标（SPEC §2.5）
  include_manufacturing_in_net: false
  # false：净碳只算运行阶段（购电碳排 − 供热替代）
  # true ：再加制造阶段碳足迹的年化摊销
  # ⚠️ 无论取何值，报告中必须写明当前口径。切换口径会使不同报告的数字不可比。
  # 建议默认 false：制造碳数据质量较差（口径差异大），混入运行碳排会引入额外不确定性。
  # 若需报告，作为"储能隐含碳"单列在附录。

# ---------------------------------------------------------------- 供热结算性质
heat_settlement:
  # 市政供热价是内部结算还是对外结算（SPEC §3.4）
  price_mun_is_external: false
  # false = 内部结算，不计入 LCOE 的收入项
  # true  = 对外结算，计入收入
  # ⚠️ 此处置直接影响 LCOE，必须在报告中写明。
  # 工业供热价默认按对外结算处理（计入收入）。
  price_ind_is_external: true


# ---------------------------------------------------------------- 储能投资
finance:
  discount_rate: 0.06      # 折现率
  project_life_years: 20   # 项目周期（年），用于 CRF
  # CRF = r(1+r)^n / ((1+r)^n - 1)，由代码计算，勿硬编码

# ---------------------------------------------------------------- 目标函数惩罚系数
#
# ⚠️ 这些系数直接影响五个策略臂的排序，必须在报告中公开取值（见 SPEC §3.4）。
penalties:
  pen_curtail: 200.0       # 弃电惩罚（元/MWh）—— 反映绿电利用率压力
  pen_sla: 5000.0          # SLA 惩罚（元 / 百万 Token 当量）—— 按延迟任务占比折算
  # 韧性缺口代价（元/MWh），进入外层 f3
  gap_cost_per_mwh: 8000.0
  # 说明：gap_cost 的量级设定会决定韧性在 Pareto 前沿上的权重。
  #       取一个明显高于电价的数值是合理的（失负荷的社会成本高于购电成本），
  #       但需在敏感性分析中检查结论对该取值的稳健性。

# ---------------------------------------------------------------- 韧性场景
resilience:
  grid_outage_hours: [2, 6, 12]      # 电网失电时长档位（h）
  n_samples_per_outage: 5            # 每档随机起始时刻的采样次数（固定种子）
  renewable_drop_percentile: 10      # 风光出力骤降取历史同期低分位
  renewable_drop_hours: [6, 12]      # 骤降持续时长（h）
  n1_storage_failure: true           # 是否评估单一储能单元故障

  # ---- 补充项（SPEC §5.1、§5.3）----

  # 长时失电场景：用于区分长续航配置。
  # ⚠️ G2/G6 场景对多数配置会产生右删失（窗口内始终正常供电），
  #    没有长时场景则无法区分续航能力。
  grid_outage_extended_hours: [24]

  # 关键负荷（v2.3 重写，SPEC §5.2）：故障期 IT 需求 = IT_base，其中关键份额由一个 IT 侧比例定义。
  #   关键负荷的母线侧需求 = critical_it_fraction · IT_base · PUE(t)（制冷随 PUE 自动产生）
  #   关键负荷被满足 ⟺ shed_c(t) = 0
  # ⚠️ v2.2 的 critical_load_fraction 三分数（推理/制冷/安全）已删除：
  #    在推理份额上再乘 PUE 后三项之和不闭合（R-NW：0.869 ≠ 0.7182），
  #    且制冷由 PUE 自动产生、安全等固定负荷已在 it_overhead_mw 中，无需单列。
  critical_it_fraction: 0.60

  # 关键负荷判据的数值阈值（SPEC §5.2，v2.4 新增）
  #   关键负荷被满足 ⟺ shed_c(t) ≤ epsilon_shed_mw
  # ⚠️ 与第一级的精确字典序（τ = 0）配套使用。
  #    理论上 shed_c 应为 0；该阈值只为吸收浮点残差，**不是**允许的削减量。
  #    取值必须远小于任何有物理意义的负荷（1e-9 MW = 1 mW）。
  #    ⚠️ 续航（§5.3）与删失定义必须用**同一个**阈值。
  epsilon_shed_mw: 1.0e-9

  # 供热缺口的数值阈值（SPEC §5.3，v2.5 新增）
  #   市政供热完整满足 ⟺ unserved_heat(t) ≤ epsilon_heat_mw_th
  # ⚠️ 与 epsilon_shed_mw 同性质：只为吸收浮点残差。
  #    N-1 通过判据与"关键服务"状态都用它。
  epsilon_heat_mw_th: 1.0e-9

  # 故障初始 SOC
  fault_initial_soc_mode: "from_normal_end"
  # "from_normal_end"：取故障前正常调度结束时的 SOC（推荐，与正常轨迹衔接）
  # "fixed"          ：固定值，需同时给出 fault_initial_soc_value
  # ⚠️ 两种取法含义不同，必须固定其一并在报告中写明。
  fault_initial_soc_value: 0.50      # 仅当 mode="fixed" 时生效

  # 降级策略的储能放电规则
  discharge_order: [Na, Li]
  # 按此顺序放电（先放钠电）。理由：保护循环寿命更长的体系。
  # ⚠️ 该选择依赖参数标定结果，标定后需复核是否仍合理，并在报告中说明依据。
  parallel_discharge: false          # false = 顺序放电；true = 按功率比例同时放电

  # 电与热在故障期间的优先级
  priority: "electricity_first"      # 电优先；热在电满足后由剩余余热提供

  # 热中断损失（元/MWh_th），用于把热失供折算进 gap_cost
  heat_outage_cost_per_mwh: 500.0

  # N-1 通过判定（SPEC §5.3）
  # ⚠️ 不使用 T_island 阈值：N-1 不切断电网，按 U16 不报告孤岛续航。
  #    改为按"观察窗口内关键负荷被完整满足"判定。
  n1_observation_hours: 24.0
  n1_pass_requires_full_service: true

  # 组合场景（同时发生的多重故障，SPEC §5.1）
  # 这是实际中最危险的工况：储能本已缺一半，电网又不可用。
  combined_scenarios:
    renewable_drop_plus_grid_outage: true    # R-drop + G
    n1_plus_grid_outage: true                # N-1 + G

  # f3 的唯一公式的参考值（SPEC §5.4）
  # ⚠️ 用配置常数，不用 A0 实际结果——A0 无储能，其 T_island 可能为零，作分母会除零；
  #    且取 A0 结果会导致跨批次不可比。两者都必须 > 0，加载时校验。
  eens_reference_mwh: 50.0
  t_island_reference_hours: 12.0
  w_eens: 0.5
  w_island: 0.5
  # 热中断损失 heat_outage_cost_per_mwh 不进入 f3，仅作旁路指标报告（§5.4）。
  # 理由：该货币化系数缺乏可靠依据，混入优化目标会让 f3 高度依赖这个假设值。

# ---------------------------------------------------------------- 供热接纳
heat_acceptance:
  q_ind_capacity_default_mw_th: 0.0
  # 工业用热接纳能力上限。⚠️ 若无工业用热需求必须设为 0，
  # 而不是保留一个售价让求解器凭空产生收入。实际值由 regions/*.yaml 提供。
  #
  # ⚠️ heat_tolerance 已删除（SPEC §2.4）。原因有二：
  #    1. min/max 分配规则下 Q_mun_hp = min(Q_hp, demand) ≤ demand，
  #       正常模式不会超额交付，容差失去原用途（原为避数值困难）
  #    2. 它会让 Q_dump ≡ 0 不成立——cap = demand·(1+tol) + ind_cap 时，
  #       取 Q_hp = cap 会得到 Q_dump = demand·tol > 0
  #    删除后热泵需求侧上限为硬等式：P_hp ≤ [ demand + ind_cap ] / COP

# ---------------------------------------------------------------- 供热碳口径
#
# ⚠️ 唯一真源：本段是供热与备用热源碳参数的**唯一定义处**，system.yaml 不重复定义。
heat_carbon:
  # ⚠️ v1.7 起市政与工业的碳口径**不同**（SPEC §2.5）：
  #
  #   市政侧：余热收益体现为 Q_boiler 降低 → carbon_grass 降低。
  #           不单列 carbon_avoid——否则会与锅炉自身排放双重计算。
  #           （锅炉在系统边界内，scope 1）
  #
  #   工业侧：替代的是**边界外**的热源，保留为 carbon_avoid。
  #
  ci_ind_substituted: 220.0          # 工业供热替代的热源碳强度（kgCO₂/MWh_th）
  ci_ind_substituted_type: "燃气锅炉"  # 必须标注所替代的热源类型
  city_heat_as_carbon_avoid: false   # 市政侧是否单列碳抵扣。⚠️ 必须为 false
  note: "两项碳口径必须在报告中分别说明，不得合并表述为'供热避免碳排'"

  # 备用热源（燃气锅炉）碳排，已计入 carbon_grass
  ci_boiler: 220.0                   # kgCO₂/MWh_th（含燃烧环节）
  ci_boiler_source: "placeholder — 需按锅炉类型与燃料标定"

# ---------------------------------------------------------------- 碳资产
carbon_asset:
  include_in_economics: false        # ⚠️ 必须为 false（见 SPEC §10.5）
  # 碳减排量可以单独报告，但不得按碳价折算成收入计入经济性指标。
  # 若需要给出参考估算，单列为"参考估算（未计入经济性）"。
