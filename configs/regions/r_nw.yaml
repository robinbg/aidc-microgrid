# 地区画像 R-NW：北方风电富集
# 典型场景：内蒙古乌兰察布、宁夏中卫、河北张家口一带算力枢纽
#
# ⚠️ 全部数值为占位值。气象与负荷序列由确定性生成器按此处参数生成（固定种子），
#    可用公开典型气象年数据做参考标定，但结论须标注为模拟数据。

region_id: R-NW
display_name: "北方风电富集"
latitude: 40.99
longitude: 113.13

# ---------------------------------------------------------------- 气候
climate:
  T_min_celsius: -25.0          # 冬季最低气温（℃）—— 低温折减的关键输入
  T_max_celsius: 30.0           # 夏季最高气温
  T_mean_annual: 5.0
  # 逐时温度生成参数（年周期 + 日周期 + 噪声，固定种子）
  seasonal_amplitude: 17.5
  diurnal_amplitude: 6.0
  noise_std: 2.0

# ---------------------------------------------------------------- 可再生资源
renewables:
  pv_capacity_mw: 20.0
  wind_capacity_mw: 40.0
  # 容量因子（用于生成逐时出力曲线）
  cf_pv: 0.17
  cf_wind: 0.35
  # 风电反调峰特征：夜间出力偏高的强度（0 = 无特征，1 = 强特征）
  wind_anticorrelation_strength: 0.8
  source: "PLACEHOLDER — 需用公开辐照度/风速数据或典型气象年标定"

# ---------------------------------------------------------------- 电价覆盖
electricity_override:
  price_valley: 280.0
  price_flat: 430.0
  price_peak: 620.0
  note: "低电价区，谷段价格是主要吸引力之一"

# ---------------------------------------------------------------- 碳因子覆盖
carbon_override:
  ci_grid_mid: 620.0
  note: "火电占比较高的区域电网，碳因子偏高"

# ---------------------------------------------------------------- 供热需求
#
# ⚠️ 需求已按系统产热能力重标定（SPEC §7.3）。
#    AIDC 可回收余热上限 = (14/15) × IT_served（系数由 COP 与 eta_recovery 现算）：
#        基础负荷 0.7182 MW → 0.6703 MW_th
#        平均负荷 2.052 MW  → 1.9152 MW_th
#        满载 4.3008 MW     → 4.0141 MW_th
#    原峰值 8.0 MW_th 从未与系统规模校验，物理上撑不起。
#    新峰值 3.5 MW_th 使余热贡献占比约 55%（冬季均载口径）。
#    峰值缺口由备用热源（燃气锅炉，4.0 MW_th）补足，因此刚性需求恒可满足。
heat:
  q_mun_demand_peak_mw_th: 3.5   # 冬季峰值（MW_th）
  q_mun_demand_base_mw_th: 1.2   # 非供热季基值
  q_ind_capacity_mw_th: 2.0      # 工业用热接纳能力上限（与市政共享同一份热量）
  heating_season_months: [10, 11, 12, 1, 2, 3, 4]
  note: "供热季长、需求强。余热为补充热源，缺口由锅炉补足——这与方案表述一致"

# ---------------------------------------------------------------- 算力条件
#
# ⚠️ IT_base 不再在此设定——它是**导出量**：
#     IT_base = gpu_capacity_total × s1_reserved_fraction × gpu_power
#   见 system.yaml 的说明与 SPEC §2.2。
compute_override:
  gpu_capacity_total: 6144
  s1_reserved_fraction: 0.167    # 在线推理占比低 → 导出 IT_base ≈ 0.718 MW
  # 任务柔性比：规划任务电量 / 全系统 IT 电量（分母含 S1，见 SPEC §2.2）
  # 可达性校验（§AA）：E_tasks 需求 ≈ 224 MWh，
  # 规划容量全年最大可发电量 ≈ 602 MWh，所需平均利用率 ≈ 37%，可达
  flexible_task_ratio: 0.65
  note: "训练/微调占比高，时间柔性大"

# ---------------------------------------------------------------- 储能布置条件
storage_site_override:
  area_limit_m2: 8000.0
  # 户外集装箱布置，储能温度接近环境温度（这是低温折减真正起作用的原因）
  outdoor_installation: true
  # 若为 indoor，储能温度受机房环境影响，低温折减作用会显著减弱
  note: "户外布置 + 严寒冬季 = 低温折减是本地区配置决策的主导因素"
