# 系统参数：算力集群、制冷、热泵、余热回收
# 单位约定见 SPEC §1.1（功率 MW，能量 MWh，热功率 MW_th）

# ---------------------------------------------------------------- 算力集群
#
# ⚠️ 关键关系（SPEC §2.2）：
#
#     IT_base(t) = gpu_capacity_s1_reserved × gpu_power
#
#   即"不可迁移负荷"就是**留给 S1 的那部分卡的满载功耗**。
#   这使 IT_base 成为**导出量**，而不是可独立设定的旋钮。
#
#   为什么必须这样：v1.5 的 it_base_mw = 8.0 与 gpu_capacity_s1_reserved = 1024
#   不自洽（1024 × 0.7 kW = 0.72 MW，相差一个数量级），导致 E_S1 远大于
#   规划容量的全年最大可发电量，四个画像的目标柔性占比全部无法实现。
#   改为导出后，此类冲突在配置层就不可能发生。
#
#   ⚠️ 若系统实际有与算力无关的负荷（照明、办公、消防等），
#      另设 `it_overhead_mw` 字段显式加入，不要混进 IT_base 的定义。
compute:
  gpu_capacity_total: 6144      # 集群总卡数
  # 留给 S1（在线推理，不可迁移）的卡数比例，按画像覆盖
  # ⚠️ 不再给绝对卡数，改为比例——比例随总规模缩放，不会与总量脱钩
  s1_reserved_fraction: 0.167   # 默认值；R-EAST / R-SOUTH 覆盖为 0.25
  gpu_power:
    value: 0.7
    unit: "kW/卡"               # 加载时换算为 MW/卡（÷1000，见 §1.1 换算表）
    internal_unit: "MW/卡"
    source: "PLACEHOLDER — 需按目标机型标定"
  # 与算力无关的固定电负荷（MW），默认 0
  it_overhead_mw: 0.0
  # 以下两项为**导出量**，代码按上式算出后覆盖此处取值；写在此处仅为文档目的
  gpu_capacity_s1_reserved_derived: 1026    # = round(6144 × 0.167)
  it_base_mw_derived: 0.7182                # = 1026 × 0.7 kW / 1000
  gpu_capacity_plan_derived: 5118           # = 6144 − 1026

  token_per_gpu_hour: 0.9       # 每 GPU·h 产出的 Token 数（百万 Token / GPU·h）
  # ⚠️ 占位值，需按模型与推理/训练混合比例标定；直接影响
  #    "每百万 Token 成本/碳排"两个指标，务必在报告中标注来源
  s1_equivalent_gpu_hours_per_mw: 1400.0
  # S1 对应的等效 GPU·h（用于 Token 总量的完整核算）
  # 说明：若无法标定此项，报告口径收窄为"仅统计规划任务的 Token"，并明确说明


# ---------------------------------------------------------------- 制冷（PUE 随环境温度变化）
#
# ⚠️ 禁止把 PUE 设为常数（见 SPEC §13.3）。此处为分段线性关系。
# 结构说明（v1.1 修正）：points 与 source 同层，points 的值才是序列。
#   v1.0 曾把 source 写在序列项同一缩进层，那是非法 YAML，已修正。
pue:
  points:
    - {T_amb: -25, value: 1.12}
    - {T_amb: -10, value: 1.15}
    - {T_amb:   0, value: 1.18}
    - {T_amb:  10, value: 1.25}
    - {T_amb:  20, value: 1.35}
    - {T_amb:  30, value: 1.50}
    - {T_amb:  40, value: 1.65}
  source: "PLACEHOLDER — 需按实际制冷形式（自然冷却/机械制冷占比）标定"

# ---------------------------------------------------------------- 热泵与余热
#
# ⚠️ 余热口径（SPEC §2.4）：
#
#     W_it(t) = IT_load(t) + κ · P_cool(t)
#     Q_rec   = η_rec · W_it
#     Q_hp    ≤ COP/(COP−1) · Q_rec  = (14/15) · W_it     （COP = 4、η_rec = 0.7 时）
#               系数由 cop 与 eta_recovery **现算**，禁止硬编码 0.9333
#               （0.9333 是 14/15 的四位截断，在满载处差 1.43e-4 MW_th）
#
#   κ 默认 0：只计 IT 侧排热（冷板液冷/背板换热器回收 40–60℃ 中温热水）。
#   制冷机组排热温度更低，通常直排环境。
#   κ > 0 表示额外回收制冷冷凝热，需专门设计，启用时须在报告中说明依据。
#
#   为什么默认 0：把 P_cool 计入会引入虚假耦合——冷气候 → 低 PUE → 可用热更少，
#   而冷气候同时意味着供热需求更高。κ = 0 使余热供给与 PUE 无关。
#
#   可回收余热上界由 IT 用电量决定，这是物理约束：
#       满载 4.3008 MW 时 Q_hp_max = (14/15) × 4.3008 = 4.01408 MW_th
thermal:
  cop: 4.0                      # 热泵性能系数
  eta_recovery: 0.70            # IT 侧排热可回收比例
  kappa_cooling_heat: 0.0       # 制冷侧排热的可回收比例，默认 0

  # ---- 备用（峰值）热源：燃气锅炉 ----
# ---------------------------------------------------------------- 备用（峰值）热源：燃气锅炉
  # ⚠️ 为什么需要（SPEC §2.4）：AIDC 可回收余热上限受 IT 用电量约束，撑不起区域供热
  #    的峰值需求（尤其冬季）。供热系统历来配峰值锅炉，这是常规工程做法。
  #    它的作用是让"市政刚性需求"约束恒可行，同时使方案一贯的表述
  #    "余热经热泵提温后作为补充热源，不是主要热源"（SPEC §10.2）在模型里字面成立。
  #
  #    经济性上模型会自动优先用余热：热泵热边际成本 ≈ 电价/COP ≈ 430/4 = 107.5 元/MWh_th，
  #    锅炉 ≈ 400 元/MWh_th。锅炉只在余热不足时出力。
  backup_heat:
    q_capacity_mw_th: 4.0       # 可单独覆盖峰值需求
    thermal_efficiency: 0.90
    unit_cost_yuan_per_mwh_th: 400.0
    source: "placeholder — 需按实际锅炉类型与燃料价格标定"
    note: "锅炉在系统边界内，其碳排计入毛碳排；市政余热收益通过降低锅炉出力体现，不再单列碳抵扣"
    # ⚠️ 锅炉碳强度 ci_boiler 定义在 economics.yaml 的 heat_carbon 段（唯一真源），
    #    此处不定义——同一参数两处定义时会由加载顺序静默决定取值。

  # ---- 供热价格 ----
  heat_price_mun: 50.0          # 市政供热结算价（元/MWh_th）；是否对外结算见 economics.yaml
  heat_price_ind: 80.0          # 工业供热售价（元/MWh_th）
  #
  # ⚠️ 碳口径相关的三个参数统一放在 economics.yaml 的 `heat_carbon` / `backup_heat`
  #    处定义，此处不重复（避免同一参数两处定义、静默覆盖）：
  #        ci_ind_substituted   工业供热替代的热源碳强度
  #        ci_boiler            备用热源单位供热碳排
  #    唯一真源原则：同一参数只在一处定义。
  #
  # 注：市政需求峰值与工业接纳上限由 regions/*.yaml 的 heat 段提供（v1.7 起必需项）

# ---------------------------------------------------------------- 储能物理边界
storage_common:
  soc_min: 0.10                 # 硬下限（与化学文件中的 soc 段共同生效，取更严者）
  soc_max: 0.90
  # 面积与承重上限（SPEC §2.3 与 chemistry*.yaml 的 footprint 配合）
  area_limit_m2: 8000.0         # 可用储能布置面积上限
  # ⚠️ 面积约束用于体现钠电能量密度低的客观限制，必须真正进入 MILP 约束，
  #    而不是只写在文档里。

# ---------------------------------------------------------------- 电网交互
grid:
  import_capacity_mw: 30.0      # 并网购电功率上限（MW）
  export_capacity_mw: 0.0       # 上网功率上限，默认 0（不允许向电网售电）
  # 若设为非 0，需在 economics.yaml 中提供 price_sell 曲线。

# ---------------------------------------------------------------- 储能布置环境
# 决定储能实际温度，进而决定低温折减是否起作用（SPEC §7.2）
storage_site_default:
  outdoor_installation: true    # true = 储能温度 = 环境温度
  indoor_temp_offset: 15.0      # 室内布置时储能温度 = 环境温度 + 偏移（℃）
  indoor_temp_floor: 15.0       # 室内温度下限（℃，受机房散热影响）
  indoor_temp_ceiling: 35.0     # 室内温度上限
  # 说明：outdoor=true 时低温折减机制真正起作用（北方场景）；
  #       室内布置时低温折减几乎不产生约束（东部/南方场景）。

# ---------------------------------------------------------------- 求解器
solver:
  name: "highs"
  threads: 1                    # 单线程，消除并行求解的浮点不确定性（SPEC §3.8）
  random_seed: 0                # 求解器自身种子
  mip_gap: 0.01
  time_limit_s: 60.0            # 单次 168h 调度的求解时间上限
  presolve: true
  verbose: false
