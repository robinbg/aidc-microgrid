[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidc-microgrid"
version = "0.1.0"
description = "钠电与绿电的 AIDC 微电网：双层联合优化与跨地区配置映射（仿真）"
requires-python = ">=3.11"
dependencies = [
    # --- 数值与数据处理 ---
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",

    # --- 配置 ---
    "pyyaml>=6.0",

    # --- 优化：内层 MILP ---
    # 方案 A：PuLP + HiGHS（推荐，建模直观，开源）
    "pulp>=2.8",
    # 方案 B（可选替代）：OR-Tools CP-SAT / linear_solver
    # "ortools>=9.8",

    # --- 优化：外层 BO ---
    # 方案 A：BoTorch（支持多目标 EHVI、约束 BO、多保真）
    "botorch>=0.9.5",
    "torch>=2.1",
    # 方案 B（轻量替代）：若环境装不上 torch，用以下之一
    # "scikit-optimize>=0.9",
    # "scikit-learn>=1.3",        # 自带 GaussianProcessRegressor

    # --- 可视化 ---
    "matplotlib>=3.8",

    # --- 测试 ---
    "pytest>=7.4",
]

[project.optional-dependencies]
# 电化学仿真（用于校验参数区间，非必须依赖）
pybamm = ["pybamm>=24.1"]
dev = ["ruff>=0.3", "mypy>=1.8", "jupyterlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: 需要长时间运行的测试（全年高保真、网格扫描）",
    "solver: 需要 MILP 求解器的测试",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
